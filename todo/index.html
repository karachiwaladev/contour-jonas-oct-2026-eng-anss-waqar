<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Todo</h1>
      <p class="count" id="count" aria-live="polite"></p>
    </header>

    <form id="new-task" class="new-task" autocomplete="off">
      <div class="row">
        <label class="visually-hidden" for="title">New task</label>
        <input id="title" name="title" type="text" placeholder="What needs doing?" maxlength="200" required>
        <button type="submit">Add</button>
      </div>
      <div class="row details">
        <label class="field">
          <span>Priority</span>
          <select id="priority" name="priority">
            <option value="high">▲ High</option>
            <option value="medium" selected>● Medium</option>
            <option value="low">▼ Low</option>
          </select>
        </label>
        <label class="field">
          <span>Due</span>
          <input id="due" name="due" type="date">
        </label>
        <label class="field">
          <span>Repeat</span>
          <select id="repeat" name="repeat">
            <option value="">Never</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="field grow">
          <span>Tags</span>
          <input id="tags" name="tags" type="text" placeholder="work, urgent" maxlength="200">
        </label>
      </div>
    </form>
    <p class="error" id="error" role="alert" hidden>Please enter a task.</p>

    <nav class="filters" aria-label="Filters">
      <div class="segmented" role="group" aria-label="Status" id="status-filter">
        <button type="button" data-status="all" aria-pressed="true">All</button>
        <button type="button" data-status="active" aria-pressed="false">Active</button>
        <button type="button" data-status="completed" aria-pressed="false">Completed</button>
      </div>
      <div class="tag-filter" role="group" aria-label="Priority" id="priority-filter" hidden></div>
      <div class="tag-filter" role="group" aria-label="Tag" id="tag-filter" hidden></div>
    </nav>

    <ul id="list" class="list" aria-label="Tasks"></ul>
    <p class="empty" id="empty">No tasks yet. Add one above.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
